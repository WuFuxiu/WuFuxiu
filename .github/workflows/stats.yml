name: Update GitHub Statistics

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stats.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Generate dark GitHub stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: 'username=WuFuxiu&show_icons=true&hide_border=true&bg_color=0C1928&title_color=71D9D0&text_color=E1F2F6&icon_color=7EE9AF'
          path: assets/generated/stats-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: 'true'

      - name: Generate light GitHub stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: 'username=WuFuxiu&show_icons=true&hide_border=true&bg_color=F4F9FB&title_color=146C72&text_color=234355&icon_color=178673'
          path: assets/generated/stats-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: 'true'

      - name: Generate dark languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: 'username=WuFuxiu&layout=compact&langs_count=6&hide_border=true&bg_color=0C1928&title_color=71D9D0&text_color=E1F2F6'
          path: assets/generated/langs-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: 'true'

      - name: Generate light languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: 'username=WuFuxiu&layout=compact&langs_count=6&hide_border=true&bg_color=F4F9FB&title_color=146C72&text_color=234355'
          path: assets/generated/langs-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: 'true'

      - name: Commit refreshed SVG cards
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/generated/*.svg
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh GitHub stats cards'
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
